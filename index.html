<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>欧洲之旅 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 布局：首页=日期卡片网格；每日页=左时间、右卡片的纵向时间线；详情=手机底部弹出 / 电脑右侧抽屉 */
  :root {
    --bg: #eef1f2;
    --surface: #ffffff;
    --surface-2: #e8ecee;
    --text: #1b2226;
    --muted: #5f6b73;
    --faint: #8a959c;
    --line: #d9dfe2;
    --accent: #2e5e52;
    --on-accent: #ffffff;
    --danger: #b3412f;
    --ok: #2f8a5c;
    --warn: #b7791f;
    --es: #c4533b;
    --fr: #3a5aa6;
    --ch: #b4303a;
    --k-sight: #2e6fb0;
    --k-food: #c0672a;
    --k-hotel: #7a4fb0;
    --k-transport: #2a8a86;
    --k-activity: #5b7a2e;
    --k-minor: #8a959c;
    --scrim: rgba(10, 16, 20, .42);
    --shadow: 0 1px 2px rgba(20,30,40,.05), 0 6px 18px rgba(20,30,40,.06);
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111517; --surface: #1a2023; --surface-2: #232a2e; --text: #e5eaed; --muted: #9aa6ad; --faint: #75828a;
      --line: #2c3539; --accent: #7cbca8; --on-accent: #0d1f1a; --danger: #e5775f; --ok: #5cc28c; --warn: #e0a84a;
      --es: #e2805f; --fr: #86a2e6; --ch: #e7686f;
      --k-sight: #7fb0e6; --k-food: #e8995e; --k-hotel: #b493e6; --k-transport: #5cc4bf; --k-activity: #a3c46a; --k-minor: #75828a;
      --scrim: rgba(0,0,0,.6);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111517; --surface: #1a2023; --surface-2: #232a2e; --text: #e5eaed; --muted: #9aa6ad; --faint: #75828a;
    --line: #2c3539; --accent: #7cbca8; --on-accent: #0d1f1a; --danger: #e5775f; --ok: #5cc28c; --warn: #e0a84a;
    --es: #e2805f; --fr: #86a2e6; --ch: #e7686f;
    --k-sight: #7fb0e6; --k-food: #e8995e; --k-hotel: #b493e6; --k-transport: #5cc4bf; --k-activity: #a3c46a; --k-minor: #75828a;
    --scrim: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap {
    max-width: 920px; margin: 0 auto;
    padding-block: 20px 96px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- 顶栏 ---------- */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .top > div:first-child { min-width: 0; }
  .top h1 { font-size: 26px; margin: 0; letter-spacing: .3px; text-wrap: balance; }
  .top .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .top-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; margin-left: auto; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 7px 13px; font-size: 13px; white-space: nowrap; min-height: 36px;
  }
  .chip:hover:not(:disabled) { background: var(--surface-2); }
  .chip:disabled { opacity: .4; cursor: default; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--muted)); }
  .sync[data-s="ok"] { --dot: var(--ok); }
  .sync[data-s="saving"] { --dot: var(--warn); }
  .sync[data-s="offline"], .sync[data-s="error"] { --dot: var(--danger); }
  .menu { position: relative; }
  .menu-pop {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 6px; min-width: 220px;
  }
  .menu-pop button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  .menu-pop button:hover { background: var(--surface-2); }
  .menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu-pop .danger { color: var(--danger); }

  .banner {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px;
  }
  .banner .big { font-size: 26px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .banner .txt { font-size: 14px; color: var(--muted); }
  .shortcuts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .shortcuts .chip { font-size: 14px; }
  .shortcuts .count { color: var(--warn); font-weight: 600; margin-left: 4px; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 2px 12px; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--c); }

  /* ---------- 首页日期卡片 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .card {
    position: relative; text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0;
    display: flex; flex-direction: column; gap: 5px; min-height: 176px;
  }
  .card:hover { border-color: var(--c); }
  .card .icon {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 25px;
    background: color-mix(in srgb, var(--c) 15%, transparent);
  }
  .card .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-top: 4px; }
  .card .dayno { font-weight: 700; font-size: 15px; }
  .card .date { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .card .place { font-size: 14px; font-weight: 600; }
  .card .theme { font-size: 13px; color: var(--muted); }
  .card .count { margin-top: auto; font-size: 12px; color: var(--faint); }
  .card .bar { height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
  .card .bar i { display: block; height: 100%; background: var(--c); }
  .card.today { border-color: var(--c); border-width: 2px; padding: 15px; }
  .card .today-tag {
    position: absolute; top: 12px; right: 12px; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--c); color: var(--surface);
  }

  /* ---------- 每日页头 ---------- */
  .dhead {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
  .nav .arrows { display: flex; gap: 6px; }
  .nav .arrows .chip { min-width: 40px; }
  .dtitle { display: flex; gap: 14px; align-items: center; }
  .dtitle > div:last-child { min-width: 0; }
  .dtitle .icon {
    width: 56px; height: 56px; border-radius: 17px; display: grid; place-items: center; font-size: 30px; flex-shrink: 0;
    background: color-mix(in srgb, var(--c) 15%, transparent);
  }
  .dtitle h2 { margin: 0; font-size: 20px; text-wrap: balance; }
  .dtitle .d { color: var(--muted); font-size: 14px; }
  .tlegend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .tlegend b { font-weight: 600; }

  /* ---------- 时间线 ---------- */
  .tl { position: relative; display: flex; flex-direction: column; gap: 6px; }
  .tl-row { display: grid; grid-template-columns: 96px 18px minmax(0, 1fr); align-items: start; position: relative; }
  .tl-row::before { /* 竖线 */
    content: ""; position: absolute; left: 104px; top: -6px; bottom: -6px; width: 2px; background: var(--line);
  }
  .tl-row:first-child::before { top: 14px; }
  .tl-row:last-child::before { bottom: auto; height: 20px; }
  .tl-time { text-align: right; padding: 12px 10px 0 0; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .tl-time .t1 { display: block; font-size: 15px; font-weight: 700; }
  .tl-time .t2 { display: block; font-size: 12px; color: var(--muted); }
  .tl-time.fixed .t1 { color: var(--accent); }
  .tl-time .tag-fixed {
    display: inline-block; margin-top: 3px; font-size: 10px; font-weight: 700; letter-spacing: .5px;
    color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 0 5px;
  }
  .tl-time.vague .t1 { font-weight: 500; font-style: italic; color: var(--muted); }
  .tl-dot { position: relative; z-index: 1; width: 12px; height: 12px; border-radius: 50%; margin: 16px 0 0 3px;
    background: var(--surface); border: 3px solid var(--kc, var(--k-minor)); }
  .tl-row.fixed .tl-dot { background: var(--kc); }
  .tl-card {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--kc);
    border-radius: 12px; padding: 11px 52px 11px 13px; cursor: pointer; min-height: 56px; text-align: left; width: 100%;
  }
  .tl-card:hover { background: color-mix(in srgb, var(--kc) 5%, var(--surface)); }
  .tl-kind { font-size: 12px; color: var(--kc); font-weight: 600; letter-spacing: .3px; }
  .tl-title { font-size: 17px; font-weight: 700; line-height: 1.3; margin-top: 1px; overflow-wrap: anywhere; }
  .tl-place { font-size: 14px; color: var(--text); opacity: .85; margin-top: 2px; overflow-wrap: anywhere; }
  .tl-place::before { content: "◉ "; color: var(--kc); font-size: 10px; vertical-align: 2px; }
  .tl-desc { font-size: 13px; color: var(--muted); margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tl-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tl-meta:empty { display: none; }
  .pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.todo { color: var(--warn); }
  .pill.booked { color: var(--ok); }
  .pill.none, .pill.unset { color: var(--faint); }
  .pill.pending { color: var(--k-food); border-style: dashed; }
  .pill.warn { color: var(--danger); font-weight: 600; }
  .warn-mark { color: var(--danger); }
  .warn-box {
    margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; font-size: 14px; line-height: 1.45;
    background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border-left: 4px solid var(--danger); color: var(--text);
  }
  .warn-box b { color: var(--danger); }
  dl.fields dd.src { font-size: 12px; color: var(--muted); }
  dl.fields dd a { overflow-wrap: anywhere; }
  .maplink { font-size: 12px; text-decoration: none; border-radius: 999px; padding: 1px 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .tl-check {
    position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: transparent; display: grid; place-items: center; padding: 0;
  }
  .tl-check i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 13px; color: transparent; }
  .tl-row.done .tl-check i { background: var(--kc); border-color: var(--kc); color: var(--surface); }
  .tl-row.done .tl-title, .tl-row.done .tl-place { text-decoration: line-through; opacity: .55; }
  .tl-row.done .tl-desc { opacity: .55; }

  .tl-row.small .tl-time { padding-top: 3px; }
  .tl-row.small .tl-time .t1 { font-size: 12px; font-weight: 500; color: var(--muted); }
  .tl-row.small .tl-time .t2 { font-size: 11px; }
  .tl-row.small .tl-dot { width: 8px; height: 8px; border-width: 2px; margin: 7px 0 0 5px; }
  .tl-small {
    background: none; border: 0; text-align: left; font-size: 13px; color: var(--muted); padding: 2px 6px 2px 4px;
    border-radius: 8px; min-height: 30px; width: 100%; cursor: pointer; overflow-wrap: anywhere;
  }
  .tl-small:hover { background: var(--surface-2); }
  .tl-small .mv { color: var(--faint); margin-right: 4px; }
  .tl-row.small.done .tl-small { text-decoration: line-through; opacity: .6; }
  .tl-row.small .custom-tag, .tl-kind .custom-tag { font-size: 10px; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 0 4px; margin-left: 4px; }

  .add-btn {
    width: 100%; margin-top: 14px; padding: 13px; border-radius: 12px; border: 1.5px dashed var(--line);
    background: transparent; color: var(--muted); font-size: 15px;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 28px 0; }

  .notes { margin-top: 22px; }
  .notes h3, .section h3 { font-size: 15px; margin: 0 0 8px; }
  textarea, input[type=text], input[type=url], input[type=date], input[type=number], select {
    width: 100%; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-height: 42px;
  }
  textarea { min-height: 84px; resize: vertical; }
  .saved { font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 4px; }
  .linkbtn { margin-top: 16px; background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 6px 0; }
  .ro-note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  /* ---------- 详情面板（底部弹出 / 右侧抽屉） ---------- */
  .sheet-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain;
    border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  @media (min-width: 900px) {
    .sheet-bg { justify-content: flex-end; align-items: stretch; }
    .sheet { max-width: 460px; max-height: none; height: 100%; border-radius: 0; padding: 0 24px 32px; }
  }
  .sheet-head {
    position: sticky; top: 0; background: var(--surface); z-index: 2; padding: 10px 0 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line);
  }
  .grab { position: absolute; left: 50%; top: 4px; width: 36px; height: 4px; border-radius: 4px; background: var(--line); transform: translateX(-50%); }
  @media (min-width: 900px) { .grab { display: none; } }
  .close-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; flex-shrink: 0; }
  .close-btn:hover { background: var(--surface-2); }
  .sh-kind { font-size: 13px; font-weight: 600; color: var(--kc); }
  .sh-title { font-size: 22px; font-weight: 700; margin: 14px 0 2px; line-height: 1.25; overflow-wrap: anywhere; }
  .sh-local { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
  .sh-time { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .tt-badge { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; }
  .tt-badge.fixed { background: var(--accent); color: var(--on-accent); }
  .tt-badge.approx { background: var(--surface-2); color: var(--muted); }
  .tt-badge.vague { border: 1px dashed var(--faint); color: var(--muted); }
  .sh-desc { margin: 10px 0 0; color: var(--text); }
  .sh-actions { display: flex; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
  .btn { border-radius: 10px; padding: 10px 16px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; min-height: 44px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
  .btn.ghost-danger { color: var(--danger); }
  .btn.done-on { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); border-color: var(--ok); color: var(--ok); }
  .map-row { display: flex; margin: 14px 0 6px; }
  .map-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; text-decoration: none; font-weight: 600;
    padding: 12px 14px; border-radius: 12px; background: var(--accent); color: var(--on-accent); min-height: 48px;
  }
  .map-missing { width: 100%; text-align: center; padding: 12px 14px; border-radius: 12px; border: 1.5px dashed var(--line); color: var(--muted); }
  .section { margin-top: 18px; }
  dl.fields { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 14px; }
  dl.fields dt { color: var(--muted); }
  dl.fields dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  dl.fields dd.missing { color: var(--faint); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
  .seg button { border: 0; background: transparent; border-radius: 9px; padding: 9px 4px; font-size: 13px; min-height: 40px; }
  .seg button.on { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
  .seg button.on[data-st="todo"] { color: var(--warn); }
  .seg button.on[data-st="booked"] { color: var(--ok); }
  .hint { font-size: 12px; color: var(--faint); margin-top: 6px; }

  /* 表单 */
  .form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .form .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .form .row2 { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px; }
  .form .row-half { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .form legend { font-size: 13px; font-weight: 600; padding: 0 4px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); min-height: 34px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--surface); padding: 10px 0 2px; }

  /* ---------- 预订清单 ---------- */
  .page-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .page-head h2 { margin: 0; font-size: 20px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 6px 0 14px; }
  .stats b { color: var(--text); }
  .bk-day { margin-top: 16px; }
  .bk-day h3 { font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .bk-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 10px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--kc); border-radius: 12px; padding: 8px 10px 8px 12px; margin-bottom: 6px;
  }
  .bk-main { background: none; border: 0; text-align: left; padding: 4px 0; min-height: 40px; cursor: pointer; min-width: 0; }
  .bk-main .k { font-size: 11px; color: var(--kc); font-weight: 600; }
  .bk-main .n { font-weight: 600; overflow-wrap: anywhere; }
  .bk-main .s { font-size: 12px; color: var(--muted); }
  .bk-row select { min-height: 40px; font-size: 13px; padding: 6px 8px; }

  .bud-head { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  .bud-total { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; overflow-x: auto; }

  .bud-total th { color: var(--muted); font-weight: 600; font-size: 12px; }

  let lang = "zh";

  function autoType(t) {

  function sortKey(item) {

  const emptyBooking = () => ({ status: "", date: "", cost: "", currency: "", link: "", note: "" });

  function seedBudget(b) {

      if (!b[cat].items.some(x => x.id === r.id)) b[cat].items.push({ id: r.id, label: r.label || "", plan: String(r.plan ?? ""), actual: String(r.actual ?? ""), currency: r.currency || "" });
    }
    return b;
  }

  function buildItem(d, r) {
    return {
      id: `o${d + 1}-${r.s}${r.sx || ""}`, src: r.s, kind: r.k,
      time: r.t, timePt: ptTime(r.t), timeType: r.tt === "f" ? "fixed" : autoType(r.t),
      title: r.n, titlePt: r.np ?? null, local: r.l || "",
      desc: r.d || "", descPt: r.dp ?? null,
      done: false, custom: false,
      details: Object.assign({}, r.x || {}), booking: emptyBooking()
    };
  }
  const buildDay = d => ({ notes: "", items: D[d].items.map(r => buildItem(d, r)) });
  const buildDefault = () => ({ version: 2, dataRev: DATA_REV, days: D.map((_, d) => buildDay(d)), budget: seedBudget(emptyBudget()) });

  // 把新版默认资料合并进已保存的一天：只填空字段；标题/说明仅在用户没改过时更新；不碰完成、预订状态、备注、自添条目
  function mergeDay(d, day) {
    const defs = new Map(buildDay(d).items.map(x => [x.id, x]));
    for (const it of day.items) {
      const def = defs.get(it.id); if (!def) continue;
      for (const [k, v] of Object.entries(def.details)) {
        if (v === "" || v == null) continue;
        if (!String(it.details[k] ?? "").trim()) it.details[k] = v;
      }
      if (!it.local && def.local) it.local = def.local;
      if (it.titlePt !== null && it.title !== def.title) { it.title = def.title; it.titlePt = def.titlePt; }
      if (it.descPt !== null && it.desc !== def.desc) { it.desc = def.desc; it.descPt = def.descPt; }
      // 未购票航班：旧默认标成了「固定」，时间没改过的改回「预计」
      if (it.timeType === "fixed" && def.timeType !== "fixed" && it.timePt !== null && it.time === def.time) it.timeType = def.timeType;
    }
    return day;
  }

  function normItem(x) {
    const it = Object.assign({
      id: uid(), src: null, kind: "activity", time: "", timePt: null, timeType: "approx",
      title: "", titlePt: null, local: "", desc: "", descPt: null, done: false, custom: true
    }, x || {});
    if (!KINDS.includes(it.kind)) it.kind = "activity";
    if (!["fixed", "approx", "vague"].includes(it.timeType)) it.timeType = autoType(it.time);
    it.details = Object.assign({}, it.details && typeof it.details === "object" ? it.details : {});

    it.id = String(it.id).replace(/[^A-Za-z0-9-]/g, "") || uid();

    return it;
  }
  const isV2Day = d => d && Array.isArray(d.items) && d.items.every(x => x && typeof x === "object" && "kind" in x);
  const isV1Day = d => d && Array.isArray(d.items) && d.items.every(x => x && typeof x === "object" && "text" in x);
  function normDay(d) { return { notes: typeof d.notes === "string" ? d.notes : "", items: d.items.map(normItem) }; }

  // 旧版（v1：每条只有 time/text）→ 新版。按原始条目编号 o{天}-{序号} 对应，保留完成状态、你改过的文字、删除和自添的条目。
  function migrateV1Day(d, old) {
    const fresh = buildDay(d);
    const oldItems = old.items || [];
    const hasIds = oldItems.some(x => /^o\d+-\d+$/.test(x.id || ""));
    const used = new Set();
    let items = [];
    if (hasIds) {
      const byId = new Map(oldItems.map(x => [x.id, x]));
      for (const it of fresh.items) {
        const o = byId.get(`o${d + 1}-${it.src}`);
        if (!o) continue;                       // 旧版里删掉了 → 新版也不出现
        used.add(o.id);
        it.done = !!o.done;
        const edited = o.timePt === null && o.textPt === null && !o.custom;
        if (edited) {
          it.time = o.time || ""; it.timePt = null; it.timeType = autoType(it.time);
          if (!it.id.endsWith("a")) { it.title = o.text || it.title; it.titlePt = null; }
        }
        items.push(it);
      }
    } else {
      items = fresh.items;
    }
    for (const o of oldItems) {
      if (used.has(o.id)) continue;
      if (hasIds && /^o\d+-\d+$/.test(o.id || "")) continue;
      if (!hasIds && !o.custom) continue;
      items.push(normItem({ id: uid(), kind: "activity", time: o.time || "", timeType: autoType(o.time), title: o.text || "", done: !!o.done, custom: true }));
    }
    return { notes: typeof old.notes === "string" ? old.notes : "", items: sortItems(items) };
  }
  // 预算：新格式 {items:[{id,label,plan,actual,currency}]}；旧格式 {plan:[],actual:[]}（每笔 amount/currency/note）自动转换，不丢数据
  function normBudget(b) {
    const out = emptyBudget();
    if (!b || typeof b !== "object") return out;
    const S = v => String(v ?? "");
    for (const c of BUD_CATS) {
      const src = b[c] || {};
      if (Array.isArray(src.items)) {
        out[c].items = src.items.filter(r => r && typeof r === "object").map(r => ({ id: S(r.id) || uid(), label: S(r.label), plan: S(r.plan), actual: S(r.actual), currency: S(r.currency) }));
      } else {
        for (const r of (Array.isArray(src.plan) ? src.plan : [])) if (r && typeof r === "object") out[c].items.push({ id: S(r.id) || uid(), label: S(r.note), plan: S(r.amount), actual: "", currency: S(r.currency) });
        for (const r of (Array.isArray(src.actual) ? src.actual : [])) if (r && typeof r === "object") out[c].items.push({ id: S(r.id) || uid(), label: S(r.note), plan: "", actual: S(r.amount), currency: S(r.currency) });
      }
    }
    return out;
  }
  // 接受 v1 / v2 的完整状态，返回 v2；格式不对返回 null
  function toV2(s, keepBudget) {
    if (!s || !Array.isArray(s.days) || s.days.length !== N) return null;
    const days = [];
    for (let d = 0; d < N; d++) {
      const x = s.days[d];
      if (isV2Day(x)) days.push(normDay(x));
      else if (isV1Day(x)) days.push(migrateV1Day(d, x));
      else return null;
    }
    const isV1 = s.days.every(isV1Day) && !s.days.every(isV2Day);

    const budget = s.budget ? normBudget(s.budget) : (keepBudget ? normBudget(keepBudget) : emptyBudget());
    if ((+s.dataRev || 1) < (SEED.rev || 0)) seedBudget(budget);

  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function loadLocal() {

  const store = { mode: "local", db: null, readOnly: false, writing: {}, next: {}, snaps: {}, stash: false, sync: "local" };
  function cacheLocal() { if (!lsSet(KEY_V2, JSON.stringify(state))) toast(tr("storageFail")); }
  const dayKey = d => `d${d}`;
  function persistDay(d) { cacheLocal(); if (store.mode === "cloud" && !store.readOnly) queue(dayKey(d), "set"); }

  function persistAll() { cacheLocal(); if (store.mode === "cloud" && !store.readOnly) { for (let d = 0; d < N; d++) queue(dayKey(d), "set"); queue("budget", "set"); } }

    else if (code === "quota_exceeded") { setSync("error"); toast(tr("quota")); }

  }
  function setSync(s) {

  const busy = () => !$("#sheetBg").hidden || !$("#askBg").hidden || (document.activeElement && /^(notes|bud-)/.test(document.activeElement.id || document.activeElement.dataset.bud || ""));

  function applyRemote(force) {
    if (!force && busy()) { store.stash = true; return; }
    store.stash = false;
    let changed = false;
    if (store.snaps.days) {

        else if (isV1Day(data)) remote[d] = migrateV1Day(d, data);

      }

  async function connect() {
    if (!(window.claude && typeof window.claude.use === "function")) { setSync("local"); return; }
    let db = null;

    const onErr = err => { clearTimeout(timer); store.mode = "local"; setSync(err && err.code === "revoked" ? "local" : "error"); };
    db.collection("days").onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (store.sync === "loading" || store.sync === "offline") setSync("ok"); }
      store.snaps.days = snap; applyRemote();
    }, onErr);
    db.collection("extra").onSnapshot(snap => { store.snaps.extra = snap; applyRemote(); }, onErr);
  }

  // ---------- 显示辅助 ----------
  function dateInfo(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const wk = lang === "pt" ? ["dom","seg","ter","qua","qui","sex","sáb"] : ["周日","周一","周二","周三","周四","周五","周六"];
    return { md: lang === "pt" ? `${d}/${m}` : `${m}/${d}`, week: wk[dt.getDay()], dt };
  }
  function todayIdx() {
    const now = new Date();
    const iso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    return D.findIndex(d => d.date === iso);
  }
  const isMain = it => MAIN_KINDS.includes(it.kind);
  const timeText = it => L(it.time, it.timePt);
  function itemTitle(it) {
    const base = L(it.title, it.titlePt);

    return base;
  }
  function itemPlace(it) {
    const x = it.details;
    if (it.kind === "food") return x.address || "";
    if (it.kind === "hotel") return x.name || "";
    if (it.kind === "transport") return [x.from, x.to].filter(Boolean).join(" → ");
    return it.local || "";
  }
  const safeUrl = u => { u = (u || "").trim(); return /^https?:\/\/[^\s]+$/i.test(u) ? u : ""; };
  function fmtTimeCol(it) {
    let s = timeText(it);
    if (!s) return `<span class="t1">—</span>`;
    s = s.replace(/^Por volta de /, "~").replace(/^Aprox\. /, "~").replace(/ do dia seguinte$/, " (+1)").replace(/^Após /, "após ");
    const m = s.match(/^(.*?\d{1,2}:\d{2})\s*[–-]\s*(.+)$/);
    const main = m ? `<span class="t1">${esc(m[1])}</span><span class="t2">– ${esc(m[2])}</span>` : `<span class="t1">${esc(s)}</span>`;
    return main + (it.timeType === "fixed" ? `<span class="tag-fixed">${esc(tr("tt_fixed"))}</span>` : "");
  }
  const kcVar = k => `var(--k-${k === "move" ? "minor" : k})`;
  // 预订清单只收真正需要购买/预订/预约的条目（名单在 data.js 的 bookingList）；
  // 另外：你自己标了「待预订 / 已预订」的条目、需要预约的餐厅，也会出现。其余条目仍保留在时间线里。
  const BK = TRIP_DATA.bookingList || {};
  const inBkList = it => Object.prototype.hasOwnProperty.call(BK, it.id);
  function inBookings(it) {
    if (it.booking.status === "todo" || it.booking.status === "booked") return true;
    if (inBkList(it)) return true;
    if (it.kind === "food") return !!(it.details.reserve && !/^(不需要|无需|não|nao|sem)/i.test(it.details.reserve.trim()));
    return false;
  }
  const bkLabel = it => (BK[it.id] ? L(BK[it.id].zh, BK[it.id].pt) : itemTitle(it));
  const bkKind = it => (BK[it.id] && BK[it.id].k) || (it.kind === "move" ? "transport" : it.kind);
  function bkGroup(it) {
    if (it.booking.status === "booked") return "booked";
    const a = it.details.bookAdvice || "";
    return a === "must" ? "must" : a === "recommend" ? "recommend" : "other";
  }
  function findItem(d, id) { const day = state.days[d]; if (!day) return null; return day.items.find(x => x.id === id) || null; }

  // ---------- 视图 ----------
  const app = $("#app");
  let renderedView = null;

  function parseHash() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    const m = /^(day-\d+|bookings|budget)?(?:-?item-(\d+)-([A-Za-z0-9-]+))?$/.exec(h);
    if (!m) return { view: "home", item: null };
    let view = m[1] || "home";
    if (view.startsWith("day-")) { const n = +view.slice(4); if (!(n >= 1 && n <= N)) view = "home"; }
    const item = m[2] ? { d: +m[2] - 1, id: m[3] } : null;
    return { view, item };
  }
  const viewHash = v => v === "home" ? "" : v;

  function topBar(sub) {
    return `
      <div class="top">
        <div>
          <h1>${esc(L(TRIP_DATA.title, TRIP_DATA.titlePt))}</h1>
          <div class="sub">${sub}</div>
        </div>
        <div class="top-actions">
          <span class="sync" id="syncChip" hidden></span>
          <button class="chip" id="langBtn">${esc(tr("langBtn"))}</button>
          <div class="menu">
            <button class="chip" id="menuBtn" aria-haspopup="true" aria-label="${esc(tr("more"))}">⋯</button>
            <div class="menu-pop" id="menuPop" hidden>
              <button data-act="bookings">${esc(tr("bookings"))}</button>
              <button data-act="budget">${esc(tr("budget"))}</button>
              <hr>
              <button data-act="export">${esc(tr("export"))}</button>
              ${store.readOnly ? "" : `<button data-act="import">${esc(tr("import"))}</button>`}
              ${store.readOnly ? "" : `<button data-act="resetAll" class="danger">${esc(tr("resetAll"))}</button>`}
            </div>
          </div>
        </div>
      </div>`;
  }

  function renderHome() {
    document.title = L(TRIP_DATA.title, TRIP_DATA.titlePt);
    const ti = todayIdx();
    const start = dateInfo(D[0].date).dt;
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const diff = Math.round((start - now) / 86400000);
    let banner = "";
    if (diff > 0) banner = `<div class="banner"><div class="big">${diff}</div><div class="txt">${esc(tr("daysLeft"))}</div></div>`;
    else if (ti >= 0) banner = `<div class="banner"><div class="big">Day ${ti + 1}</div><div class="txt">${esc(tr("onTrip", { p: L(D[ti].place, D[ti].placePt) }))}</div></div>`;
    const todoCount = state.days.reduce((a, day) => a + day.items.filter(it => inBookings(it) && it.booking.status === "todo").length, 0);

    const cards = D.map((d, i) => {
      const s = state.days[i], di = dateInfo(d.date);
      const main = s.items.filter(isMain);
      const total = main.length, done = main.filter(x => x.done).length;
      const pct = total ? Math.round(done / total * 100) : 0;
      const sights = s.items.filter(x => x.kind === "sight").length;
      const food = s.items.filter(x => x.kind === "food" && !x.details.name).length;
      const trans = s.items.filter(x => x.kind === "transport").length;
      const ov = [sights && tr("ovSights", { n: sights }), trans && tr("ovTrans", { n: trans }), food && tr("ovFood", { n: food })].filter(Boolean).join(" · ");
      const prog = [done ? tr("ovDone", { d: done, t: total }) : "", s.notes ? tr("ovNotes") : ""].filter(Boolean).join(" · ");
      return `
        <button class="card ${i === ti ? "today" : ""}" style="--c: var(--${d.country})" data-day="${i}">
          ${i === ti ? `<span class="today-tag">${esc(tr("today"))}</span>` : ""}
          <div class="icon" aria-hidden="true">${d.icon}</div>
          <div class="meta"><span class="dayno">Day ${i + 1}</span><span class="date">${di.md} ${di.week}</span></div>
          <div class="place">${esc(L(d.place, d.placePt))}</div>
          <div class="theme">${esc(L(d.theme, d.themePt))}</div>
          <div class="count">${esc(ov)}${prog ? `<br>${esc(prog)}` : ""}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </button>`;
    }).join("");

    app.innerHTML = `
      ${topBar(esc(tr("sub")))}
      ${banner}
      <div class="shortcuts">
        <button class="chip" data-go="bookings">${esc(tr("bookings"))}${todoCount ? `<span class="count">${esc(tr("toBook", { n: todoCount }))}</span>` : ""}</button>
        <button class="chip" data-go="budget">${esc(tr("budget"))}</button>
      </div>
      <div class="legend">
        <span style="--c: var(--es)">${esc(tr("es"))}</span>
        <span style="--c: var(--fr)">${esc(tr("fr"))}</span>
        <span style="--c: var(--ch)">${esc(tr("ch"))}</span>
      </div>
      <div class="grid">${cards}</div>`;
    app.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => go(`day-${+c.dataset.day + 1}`)));
    app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  }

  function rowHtml(d, it) {
    const kc = kcVar(it.kind);
    if (!isMain(it)) {
      return `
        <div class="tl-row small ${it.done ? "done" : ""}" style="--kc:${kc}">
          <div class="tl-time ${it.timeType}">${fmtTimeCol(it)}</div>
          <div class="tl-dot"></div>
          <button class="tl-small" data-open="${esc(it.id)}">${it.kind === "move" ? `<span class="mv">↳</span>` : ""}${esc(L(it.title, it.titlePt))}${it.custom ? `<span class="custom-tag">${esc(tr("custom"))}</span>` : ""}${it.details.warning ? `<span class="warn-mark" title="${esc(tr("warnPill"))}"> ⚠</span>` : ""}</button>
        </div>`;
    }
    const place = itemPlace(it);
    const desc = L(it.desc, it.descPt);
    const map = safeUrl(it.details.mapUrl);
    const st = it.booking.status;
    const meta = [
      it.details.warning ? `<span class="pill warn">⚠ ${esc(tr("warnPill"))}</span>` : "",
      it.kind === "food" && !it.details.name ? `<span class="pill pending">${esc(tr("toChoose"))}</span>` : "",
      BOOKABLE.includes(it.kind) && st ? `<span class="pill ${st}">${esc(tr("st_" + st))}</span>` : "",
      map ? `<a class="maplink" href="${esc(map)}" target="_blank" rel="noopener noreferrer" data-stop>Google Maps ↗</a>` : ""
    ].join("");
    return `
      <div class="tl-row main ${it.done ? "done" : ""} ${it.timeType === "fixed" ? "fixed" : ""}" style="--kc:${kc}">
        <div class="tl-time ${it.timeType}">${fmtTimeCol(it)}</div>
        <div class="tl-dot"></div>
        <div class="tl-card" data-open="${esc(it.id)}" role="button" tabindex="0">
          <div class="tl-kind">${esc(tr("k_" + it.kind))}${it.custom ? `<span class="custom-tag">${esc(tr("custom"))}</span>` : ""}</div>
          <div class="tl-title">${esc(itemTitle(it))}</div>
          ${place ? `<div class="tl-place">${esc(place)}</div>` : ""}
          ${desc ? `<div class="tl-desc">${esc(desc)}</div>` : ""}
          <div class="tl-meta">${meta}</div>
          ${store.readOnly ? "" : `<button class="tl-check" data-toggle="${esc(it.id)}" aria-label="${esc(it.done ? tr("isDone") : tr("markDone"))}" aria-pressed="${it.done}"><i>✓</i></button>`}
        </div>
      </div>`;
  }

  function renderDay(d) {
    const day = D[d], s = state.days[d], di = dateInfo(day.date), ro = store.readOnly;
    document.title = `Day ${d + 1} · ${L(day.place, day.placePt)}`;
    app.style.setProperty("--c", `var(--${day.country})`);
    app.innerHTML = `
      ${topBar(`${esc(tr(day.country))} · Day ${d + 1} / ${N}`)}
      <div class="dhead">
        <div class="nav">
          <button class="chip" id="backBtn">${esc(tr("back"))}</button>
          <div class="arrows">
            <button class="chip" id="prevBtn" ${d === 0 ? "disabled" : ""} aria-label="${esc(tr("prev"))}">‹</button>
            <button class="chip" id="nextBtn" ${d === N - 1 ? "disabled" : ""} aria-label="${esc(tr("next"))}">›</button>
          </div>
        </div>
        <div class="dtitle">
          <div class="icon" aria-hidden="true">${day.icon}</div>
          <div>
            <div class="d">Day ${d + 1} · ${di.md} ${di.week}</div>
            <h2>${esc(L(day.place, day.placePt))}</h2>
            <div class="d">${esc(L(day.theme, day.themePt))}</div>
          </div>
        </div>
      </div>
      ${ro ? `<p class="ro-note">${esc(tr("roNote"))}</p>` : ""}
      <div class="tlegend">${tr("tlegend")}</div>
      <div class="tl" id="tl">${s.items.map(it => rowHtml(d, it)).join("") || `<div class="empty">—</div>`}</div>
      ${ro ? "" : `<button class="add-btn" id="addBtn">${esc(tr("add"))}</button>`}
      <div class="notes">
        <h3>${esc(tr("notesTitle"))}</h3>
        <textarea id="notes" placeholder="${esc(tr("notesPh"))}" ${ro ? "readonly" : ""}>${esc(s.notes)}</textarea>
        <div class="saved" id="savedHint"></div>
      </div>
      ${ro ? "" : `<button class="linkbtn" id="resetDay">${esc(tr("resetDay"))}</button>`}`;
    $("#backBtn").onclick = () => go("home");
    $("#prevBtn").onclick = () => d > 0 && go(`day-${d}`);
    $("#nextBtn").onclick = () => d < N - 1 && go(`day-${d + 2}`);
    const tl = $("#tl");
    tl.addEventListener("click", e => {
      if (e.target.closest("[data-stop]")) return;
      const tg = e.target.closest("[data-toggle]");
      if (tg) { e.stopPropagation(); toggleDone(d, tg.dataset.toggle); return; }
      const op = e.target.closest("[data-open]");
      if (op) openItem(d, op.dataset.open);
    });
    tl.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches(".tl-card")) { e.preventDefault(); openItem(d, e.target.dataset.open); }
    });
    if (ro) return;
    $("#addBtn").onclick = () => openNew(d);
    $("#resetDay").onclick = async () => {
      if (!await ask(tr("askResetDay", { n: d + 1 }), tr("askResetDayMsg"), tr("resetBtn"))) return;
      const before = clone(state.days[d]);
      state.days[d] = buildDay(d); cacheLocal();
      if (store.mode === "cloud" && !store.readOnly) queue(dayKey(d), "delete");
      renderView(true);
      toast(tr("restored"), () => { state.days[d] = before; persistDay(d); renderView(true); });
    };
    let tmr = null;
    const notes = $("#notes");
    const flush = () => { if (tmr) { clearTimeout(tmr); tmr = null; persistDay(d); const h = $("#savedHint"); if (h) h.textContent = tr("saved"); } };
    notes.addEventListener("input", e => { s.notes = e.target.value; $("#savedHint").textContent = ""; clearTimeout(tmr); tmr = setTimeout(flush, 700); });
    notes.addEventListener("blur", () => { flush(); setTimeout(flushStash, 0); });
  }

  function toggleDone(d, id) {
    if (store.readOnly) return;
    const it = findItem(d, id); if (!it) return;
    it.done = !it.done; persistDay(d); renderView(true);
    if (sheet.open && sheet.d === d && sheet.id === id && sheet.mode === "view") renderSheet();
  }

  // ---------- 预订清单 ----------
  const bkFilter = { st: "all", kind: "all" };
  function renderBookings() {
    document.title = tr("bookings");
    const counts = { "": 0, todo: 0, booked: 0, none: 0 };
    const costs = {};
    const sections = { must: [], recommend: [], other: [], booked: [] };
    state.days.forEach((day, d) => {
      const rows = day.items.filter(inBookings);
      rows.forEach(it => {
        counts[it.booking.status || ""]++;
        const c = parseFloat(String(it.booking.cost).replace(",", "."));
        if (it.booking.cost !== "" && isFinite(c)) { const k = (it.booking.currency || "").trim().toUpperCase() || tr("noCur"); costs[k] = (costs[k] || 0) + c; }
        if ((bkFilter.st === "all" || (it.booking.status || "") === bkFilter.st) && (bkFilter.kind === "all" || bkKind(it) === bkFilter.kind)) sections[bkGroup(it)].push({ d, it });
      });
    });
    const stChips = ["all", "", "todo", "booked", "none"].map(s => `<button class="chip ${bkFilter.st === s ? "on" : ""}" data-st="${s}">${esc(s === "all" ? tr("bk_all") : tr("st_" + s))}${s !== "all" ? ` ${counts[s]}` : ""}</button>`).join("");
    const kChips = ["all", "transport", "sight", "hotel", "food"].map(k => `<button class="chip ${bkFilter.kind === k ? "on" : ""}" data-kind="${k}">${esc(k === "all" ? tr("bk_cat_all") : tr("bkk_" + k))}</button>`).join("");
    const costTxt = Object.keys(costs).length ? Object.entries(costs).map(([c, v]) => `<b>${esc(fmtNum(v))} ${esc(c)}</b>`).join(" · ") : esc(tr("bkNoCost"));
    const list = ["must", "recommend", "other", "booked"].filter(g => sections[g].length).map(g => {
      return `<div class="bk-day bk-sec-${g}"><h3>${esc(tr("bkg_" + g))} · ${sections[g].length}</h3>${sections[g].map(({ d: dd, it }) => { const di = dateInfo(D[dd].date); return `
        <div class="bk-row" style="--kc:${kcVar(bkKind(it))}">
          <button class="bk-main" data-open="${dd}|${esc(it.id)}">
            <div class="k">${esc(tr("bkk_" + bkKind(it)))} · Day ${dd + 1} · ${di.md} · ${esc(timeText(it) || "—")}</div>
            <div class="n">${esc(bkLabel(it))}</div>
            ${itemPlace(it) ? `<div class="s">${esc(itemPlace(it))}</div>` : ""}
            <div class="s">${esc(tr("f_bookAdvice"))}：${esc(tr("adv_" + (ADVICE.includes(it.details.bookAdvice || "") ? it.details.bookAdvice || "" : "")))}${it.kind === "hotel" && it.details.checkinDate ? ` · ${esc(it.details.checkinDate)} → ${esc(it.details.checkoutDate || "")}` : ""}${it.details.warning ? ` · <span class="neg">⚠</span>` : ""}</div>
          </button>
          <select data-bk="${dd}|${esc(it.id)}" data-st="${it.booking.status}" aria-label="${esc(tr("bookingTitle"))}" ${store.readOnly ? "disabled" : ""}>
            ${["", "todo", "booked", "none"].map(s => `<option value="${s}" ${it.booking.status === s ? "selected" : ""}>${esc(tr("st_" + s))}</option>`).join("")}
          </select>
        </div>`; }).join("")}</div>`;
    }).join("");
    app.innerHTML = `
      ${topBar(esc(tr("sub")))}
      <div class="page-head"><button class="chip" id="backBtn">${esc(tr("backHome"))}</button><h2>${esc(tr("bookings"))}</h2></div>
      <div class="filters">${stChips}</div>
      <div class="filters">${kChips}</div>
      <div class="stats"><span>${esc(tr("bkCosts"))} ${costTxt}</span></div>
      <div class="hint">${esc(tr("bkHint"))}</div>
      ${list || `<div class="empty">${esc(tr("bkEmpty"))}</div>`}`;
    $("#backBtn").onclick = () => go("home");
    app.querySelectorAll("[data-st]").forEach(b => { if (b.tagName === "BUTTON") b.onclick = () => { bkFilter.st = b.dataset.st; renderView(true); }; });
    app.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { bkFilter.kind = b.dataset.kind; renderView(true); });
    app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { const [d, id] = b.dataset.open.split("|"); openItem(+d, id); });
    app.querySelectorAll("select[data-bk]").forEach(sel => sel.onchange = () => {
      const [d, id] = sel.dataset.bk.split("|"); const it = findItem(+d, id); if (!it) return;
      it.booking.status = sel.value; persistDay(+d); renderView(true);
    });
  }

  // ---------- 预算 ----------
  const fmtNum = v => (Math.round(v * 100) / 100).toLocaleString(lang === "pt" ? "pt-BR" : "zh-CN", { maximumFractionDigits: 2 });
  const parseAmt = a => { a = String(a ?? "").trim(); if (!a) return null; if (!/^[-+]?[\d\s.,]+$/.test(a)) return NaN; const v = parseFloat(a.replace(/\s/g, "").replace(",", ".")); return isFinite(v) ? v : NaN; };
  // 同一货币才相加；没填货币的单独一组，不混合
  function sumItems(items) {
    const plan = {}, act = {}; let bad = 0;
    for (const r of items) {
      const c = (r.currency || "").trim().toUpperCase() || tr("noCur");
      const p = parseAmt(r.plan), a = parseAmt(r.actual);
      if (Number.isNaN(p) || Number.isNaN(a)) bad++;
      if (p != null && !Number.isNaN(p)) plan[c] = (plan[c] || 0) + p;
      if (a != null && !Number.isNaN(a)) act[c] = (act[c] || 0) + a;
    }
    return { plan, act, bad };
  }
  function budgetRow(r) {
    const ro = store.readOnly ? "disabled" : "";
    return `
      <div class="bud-line" data-row="${esc(r.id)}">
        <input class="lbl" type="text" placeholder="${esc(tr("budLabel"))}" value="${esc(r.label)}" data-bud="label" id="bud-${esc(r.id)}-l" aria-label="${esc(tr("budLabel"))}" ${ro}>
        <input type="text" inputmode="decimal" placeholder="${esc(tr("plan"))}" value="${esc(r.plan)}" data-bud="plan" id="bud-${esc(r.id)}-p" aria-label="${esc(tr("plan"))}" ${ro}>
        <input type="text" inputmode="decimal" placeholder="${esc(tr("actual"))}" value="${esc(r.actual)}" data-bud="actual" id="bud-${esc(r.id)}-a" aria-label="${esc(tr("actual"))}" ${ro}>
        <input type="text" list="curList" placeholder="EUR" value="${esc(r.currency)}" data-bud="currency" id="bud-${esc(r.id)}-c" aria-label="${esc(tr("cur"))}" autocapitalize="characters" ${ro}>
        ${store.readOnly ? "<span></span>" : `<button class="x" data-budx aria-label="${esc(tr("del"))}">×</button>`}
      </div>`;
  }
  function subText(cat) {
    const { plan, act, bad } = sumItems(state.budget[cat].items);
    const curs = [...new Set([...Object.keys(plan), ...Object.keys(act)])].sort();
    if (!curs.length) return esc(tr("noAmounts"));
    const parts = curs.map(c => `${esc(c)}：${esc(tr("plan"))} ${esc(fmtNum(plan[c] || 0))} · ${esc(tr("actual"))} ${esc(fmtNum(act[c] || 0))}`);
    return parts.join("<br>") + (bad ? `<br><span class="neg">${esc(tr("invalid", { n: bad }))}</span>` : "");
  }
  function totalsHtml() {
    const plan = {}, act = {}; let bad = 0;
    for (const c of BUD_CATS) {
      const t = sumItems(state.budget[c].items); bad += t.bad;
      for (const [k, v] of Object.entries(t.plan)) plan[k] = (plan[k] || 0) + v;
      for (const [k, v] of Object.entries(t.act)) act[k] = (act[k] || 0) + v;
    }
    const curs = [...new Set([...Object.keys(plan), ...Object.keys(act)])].sort();
    if (!curs.length) return `<p class="hint">${esc(tr("noAmounts"))}</p>`;
    return `<table><thead><tr><th>${esc(tr("cur"))}</th><th>${esc(tr("plan"))}</th><th>${esc(tr("actual"))}</th><th>${esc(tr("diff"))}</th></tr></thead><tbody>${
      curs.map(c => { const df = (plan[c] || 0) - (act[c] || 0); return `<tr><td>${esc(c)}</td><td>${esc(fmtNum(plan[c] || 0))}</td><td>${esc(fmtNum(act[c] || 0))}</td><td class="${df < 0 ? "neg" : df > 0 ? "pos" : ""}">${esc(fmtNum(df))}</td></tr>`; }).join("")
    }</tbody></table>${bad ? `<p class="neg hint">${esc(tr("invalid", { n: bad }))}</p>` : ""}`;
  }
  function renderBudget() {
    document.title = tr("budget");
    app.innerHTML = `
      ${topBar(esc(tr("sub")))}
      <div class="page-head"><button class="chip" id="backBtn">${esc(tr("backHome"))}</button><h2>${esc(tr("budget"))}</h2></div>
      <div class="bud-total"><h3 style="margin:0 0 8px;font-size:15px">${esc(tr("totals"))}</h3><div id="budTotals">${totalsHtml()}</div></div>
      <p class="hint" style="margin:0 0 12px">${esc(tr("budHint"))}</p>
      ${BUD_CATS.map(c => `
        <div class="bud-cat" data-cat="${c}">
          <h3>${esc(tr("bud_" + c))}</h3>
          ${c === "transport" ? `<p class="hint" style="margin:-4px 0 8px">${esc(tr("budTransHint"))}</p>` : ""}
          <div class="bud-head" aria-hidden="true"><span>${esc(tr("budLabel"))}</span><span>${esc(tr("plan"))}</span><span>${esc(tr("actual"))}</span><span>${esc(tr("cur"))}</span><span></span></div>
          <div class="bud-lines">${state.budget[c].items.map(budgetRow).join("")}</div>
          ${store.readOnly ? "" : `<button class="bud-add" data-budadd>${esc(tr("addAmount"))}</button>`}
          <div class="bud-sub" id="sub-${c}">${subText(c)}</div>
        </div>`).join("")}`;
    $("#backBtn").onclick = () => go("home");

    delete ds.forceTitle;
    delete dr._time; delete dr._title; delete dr._desc;
    const item = normItem(dr);
    if (sheet.isNew) {
      item.custom = true;
      day.items.push(item);
      day.items = sortItems(day.items);
      persistDay(d); hideSheet(); renderView(true);
      toast(tr("saved"));
      return;
    }
    const idx = day.items.findIndex(x => x.id === item.id);
    if (idx >= 0) day.items[idx] = item;
    day.items = sortItems(day.items);
    persistDay(d);
    sheet.mode = "view"; sheet.draft = null;
    renderView(true); renderSheet();
    toast(tr("saved"));
  }
  function renderSheet() {
    if (!sheet.open) return;
    if (sheet.mode === "edit" && sheet.draft) { renderSheetEdit(); return; }
    const it = findItem(sheet.d, sheet.id);
    if (!it) { hideSheet(); return; }
    renderSheetView(it);
  }
  sheetBg.addEventListener("mousedown", e => { if (e.target === sheetBg) { if (sheet.mode === "edit") cancelEdit(); else closeSheet(); } });

  // ---------- 确认框 ----------
  let askResolve = null;
  function ask(title, msg, okText) {
    $("#askTitle").textContent = title; $("#askMsg").textContent = msg;
    $("#askYes").textContent = okText || tr("ok"); $("#askNo").textContent = tr("cancel");
    $("#askBg").hidden = false;
    setTimeout(() => $("#askNo").focus(), 30);
    return new Promise(res => { askResolve = res; });
  }
  function closeAsk(v) { $("#askBg").hidden = true; if (askResolve) { askResolve(v); askResolve = null; } setTimeout(flushStash, 0); }
  $("#askYes").onclick = () => closeAsk(true);
  $("#askNo").onclick = () => closeAsk(false);
  $("#askBg").addEventListener("mousedown", e => { if (e.target.id === "askBg") closeAsk(false); });

  // ---------- 导入 / 导出 ----------
  async function exportJSON() {
    const json = JSON.stringify({ app: "europa-trip-2026", version: 2, exportedAt: new Date().toISOString(), state }, null, 2);
    const filename = `欧洲行程备份_${new Date().toISOString().slice(0, 10)}.json`;
    let dl = null;
    if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch (e) {} }
    if (dl) {
      try { await dl.save({ filename, data: json }); toast(tr("exportSaved")); }
      catch (e) { if (e && e.code !== "declined") toast(tr("exportFail")); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function importText(text) {
    let next;
    try { const data = JSON.parse(text); next = toV2(data.state || data, state.budget); } catch (err) { next = null; }
    if (!next) { toast(tr("importFail")); return false; }
    if (!await ask(tr("askImport"), tr("askImportMsg"), tr("importBtn"))) return false;
    const before = clone(state);
    lsSet(KEY_BACKUP_IMPORT, JSON.stringify(before));
    state = next; persistAll(); renderView(true);
    toast(tr("imported"), () => { state = before; persistAll(); renderView(true); });
    return true;
  }
  $("#importFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (f) await importText(await f.text());
  });

  // ---------- 提示条 ----------
  let toastTmr, undoFn = null;
  function toast(msg, undo) {
    $("#toastMsg").textContent = msg;
    undoFn = undo || null;
    const ub = $("#toastUndo"); ub.hidden = !undo; ub.textContent = tr("undo");
    $("#toast").classList.add("show");
    clearTimeout(toastTmr);
    toastTmr = setTimeout(() => { $("#toast").classList.remove("show"); undoFn = null; }, undo ? 5000 : 1800);
  }
  $("#toastUndo").onclick = () => { if (undoFn) { const f = undoFn; undoFn = null; f(); } $("#toast").classList.remove("show"); };

  // ---------- 路由与键盘 ----------
  function go(view) { location.hash = viewHash(view); }
  window.addEventListener("hashchange", () => {
    renderView(false);
    syncSheetToHash();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (!$("#askBg").hidden) closeAsk(false);
      else if (sheet.open) { if (sheet.mode === "edit") cancelEdit(); else closeSheet(); }
      return;
    }
    if (busy() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    const { view } = parseHash(); if (!view.startsWith("day-")) return;
    const i = +view.slice(4) - 1;
    if (e.key === "ArrowLeft" && i > 0) go(`day-${i}`);
    if (e.key === "ArrowRight" && i < N - 1) go(`day-${i + 2}`);
  });

  // 测试用钩子（不影响使用）
  window.__trip = { get state() { return state; }, importText, toV2, KEY_V1, KEY_V2 };

  document.documentElement.lang = lang === "pt" ? "pt-BR" : "zh-CN";
  renderView(true);
  syncSheetToHash();
  connect();
})();
</script>
</body>
</html>
