<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="pwa" content="1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef1f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111517" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="欧洲之旅">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>欧洲之旅 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 布局：首页三大目的地（瑞士内再分三个地区）+ 酒店 / 交通；目的地页 = 「已选择」「备选景点」两个分页；点照片 / 标题看详情 */
  :root {
    --bg: #eef1f2; --surface: #ffffff; --surface-2: #e8ecee; --text: #1b2226; --muted: #5f6b73; --faint: #8a959c;
    --line: #d9dfe2; --accent: #2e5e52; --on-accent: #ffffff; --danger: #b3412f; --ok: #2f8a5c; --warn: #b7791f;
    --es: #c4533b; --fr: #3a5aa6; --ch: #b4303a; --scrim: rgba(10, 16, 20, .42);
    --shadow: 0 1px 2px rgba(20,30,40,.05), 0 6px 18px rgba(20,30,40,.06); --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111517; --surface: #1a2023; --surface-2: #232a2e; --text: #e5eaed; --muted: #9aa6ad; --faint: #75828a;
      --line: #2c3539; --accent: #7cbca8; --on-accent: #0d1f1a; --danger: #e5775f; --ok: #5cc28c; --warn: #e0a84a;
      --es: #e2805f; --fr: #86a2e6; --ch: #e7686f; --scrim: rgba(0,0,0,.6);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111517; --surface: #1a2023; --surface-2: #232a2e; --text: #e5eaed; --muted: #9aa6ad; --faint: #75828a;
    --line: #2c3539; --accent: #7cbca8; --on-accent: #0d1f1a; --danger: #e5775f; --ok: #5cc28c; --warn: #e0a84a;
    --es: #e2805f; --fr: #86a2e6; --ch: #e7686f; --scrim: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 18px 80px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* 顶栏 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .top h1 { font-size: 24px; margin: 0; letter-spacing: .3px; }
  .top .sub { color: var(--muted); font-size: 13px; }
  .top-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13px; white-space: nowrap; min-height: 38px; }
  .chip:hover { background: var(--surface-2); }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 210px; }
  .menu-pop button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .menu-pop button:hover { background: var(--surface-2); }
  .menu-pop .danger { color: var(--danger); }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .nav .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .back { margin-bottom: 12px; }

  /* 首页 */
  .banner { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .banner b { color: var(--accent); font-size: 20px; }
  .cd { border-radius: var(--radius); padding: 14px 16px; margin: 0 0 12px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 14%, var(--surface)), var(--surface) 70%); box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: space-between; gap: 10px 18px; flex-wrap: wrap; }
  .cd-k { font-weight: 700; font-size: 16px; }
  .cd-f { display: block; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cd-n { display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
  .cd-n span { display: flex; align-items: baseline; gap: 2px; }
  .cd-n b { font-size: 28px; line-height: 1; color: var(--accent); min-width: 1.3em; text-align: right; }
  .cd-n i { font-style: normal; font-size: 13px; color: var(--muted); }
  .cd-msg { font-size: 18px; font-weight: 700; color: var(--accent); }
  .dest-grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dest { position: relative; display: block; border: 0; padding: 0; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 5; background: var(--surface-2);
    box-shadow: var(--shadow); text-align: left; color: #fff; width: 100%; }
  .dest img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dest .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.05) 55%); }
  .dest .txt { position: absolute; left: 16px; right: 16px; bottom: 14px; }
  .dest .flag { font-size: 26px; line-height: 1; }
  .dest .nm { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .dest .en { font-size: 14px; opacity: .9; }
  .dest .meta { font-size: 13px; opacity: .9; margin-top: 4px; }
  .dest .covers { font-size: 12px; opacity: .85; margin-top: 2px; }
  .links { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 12px; }
  .link-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; text-align: left; min-height: 64px; }
  .link-card .ic { font-size: 24px; }
  .link-card b { display: block; font-size: 16px; }
  .link-card span { font-size: 13px; color: var(--muted); }
  .small-note { color: var(--muted); font-size: 13px; margin: 12px 0 0; }

  /* 目的地页 */
  .rhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 4px; }
  .rhead h2 { margin: 0; font-size: 24px; }
  .rhead .d { color: var(--muted); font-size: 14px; }
  .rcovers { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; margin: 12px 0 12px; }
  .tabs button { border: 0; background: transparent; border-radius: 10px; min-height: 44px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .tabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .tabs .n { font-weight: 500; font-size: 13px; margin-left: 4px; }
  .days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; margin-bottom: 4px; scrollbar-width: thin; }
  .days .chip { flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .days .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .day-h { font-size: 15px; margin: 18px 0 10px; display: flex; align-items: baseline; gap: 8px; }
  .day-h:first-of-type { margin-top: 6px; }
  .day-h .n { font-size: 13px; color: var(--muted); font-weight: 500; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1.5px dashed var(--line); border-radius: 12px; text-align: center; }
  .att { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
  .att.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
  .ph { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; min-height: 0; display: block; width: 100%; border: 0; padding: 0; cursor: pointer; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; display: block; }
  .ph .fallback { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--muted);
    background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 12px, var(--surface) 12px, var(--surface) 24px); }
  .ph .area { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ph .bk { position: absolute; right: 10px; top: 10px; background: var(--ok); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .att h3 { margin: 0; font-size: 18px; line-height: 1.3; }
  .tl { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; color: inherit; display: inline-flex; gap: 6px; align-items: baseline; }
  .tl .go { color: var(--faint); font-size: 14px; font-weight: 400; }
  .cf { margin: 0; font-size: 13px; padding: 6px 10px; border-radius: 8px; color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, var(--surface)); }
  .local { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  dl.facts { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  .tbc { color: var(--faint); }
  .warn { margin: 0; font-size: 13px; padding: 7px 10px; border-radius: 8px; background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border-left: 3px solid var(--danger); }
  .map { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; min-height: 40px; padding: 8px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); align-self: flex-start; }
  .map.none { background: none; color: var(--faint); font-weight: 400; padding-left: 0; }
  .plan { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plan label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  input[type=text], input[type=url], input[type=date], input[type=time], textarea, select {
    width: 100%; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 42px; }
  textarea { min-height: 76px; resize: vertical; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tg { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 44px; font-size: 14px; cursor: pointer; user-select: none; }
  .tg input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
  .tg.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); font-weight: 600; }
  details.more { border-top: 1px solid var(--line); padding-top: 6px; font-size: 14px; }
  details.more summary { cursor: pointer; color: var(--muted); min-height: 40px; display: flex; align-items: center; }
  details.more .in { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  details.more p { margin: 0; overflow-wrap: anywhere; }
  .credit { font-size: 11px; color: var(--faint); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; min-height: 42px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
  .btn.ghost-danger { color: var(--danger); }
  .add-btn { width: 100%; margin-top: 14px; padding: 13px; border-radius: 12px; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); font-size: 15px; }

  /* 详情 */
  .dt { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
  .dt .ph { border-radius: 12px; cursor: default; }
  .dt h4 { margin: 0 0 6px; font-size: 15px; }
  .route { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
  .route .small { font-size: 12px; color: var(--muted); }
  .linkrow { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }

  /* 酒店 / 交通 */
  .grp-title { font-size: 16px; margin: 20px 0 10px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
  .grp-title:first-of-type { margin-top: 6px; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .item { background: var(--surface); border: 1px solid var(--line); border-left-width: 5px; border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .item.ok { border-left-color: var(--ok); }
  .item.no { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 6%, var(--surface)); }
  .item.na { border-left-color: var(--faint); }
  .item .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .item h3 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
  .item .city { font-size: 13px; color: var(--muted); }
  .item .when { font-size: 14px; font-variant-numeric: tabular-nums; }
  .item .route2 { font-size: 15px; font-weight: 600; }
  .item .times { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .item .note { font-size: 13px; color: var(--muted); }
  .legs { display: flex; flex-direction: column; gap: 4px; }
  .leg { font-size: 14px; font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); overflow-wrap: anywhere; }
  .leg b { margin-right: 6px; }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; font-weight: 600; }
  .badge.ok { color: var(--ok); } .badge.no { color: var(--warn); } .badge.na { color: var(--faint); }
  .datebox { font-size: 13px; font-weight: 700; color: var(--accent); }

  /* 面板（手机底部弹出 / 电脑右侧） */
  .sheet-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; border-radius: 20px 20px 0 0;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  @media (min-width: 900px) { .sheet-bg { justify-content: flex-end; align-items: stretch; } .sheet { max-width: 460px; max-height: none; height: 100%; border-radius: 0; padding: 0 24px 28px; } }
  .sheet-head { position: sticky; top: 0; background: var(--surface); z-index: 2; padding: 12px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
  .sheet-head b { font-size: 16px; }
  .close-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; flex-shrink: 0; }
  .form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .form label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .form .legbox { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form .legbox b { grid-column: 1 / -1; font-size: 13px; }
  .upd { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 85; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--on-accent); padding: 10px 18px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); min-height: 44px; max-width: calc(100% - 32px); }
  .plus-btn { margin-left: auto; align-self: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); font-size: 22px; line-height: 1; display: grid; place-items: center; padding: 0 0 2px; }
  .plus-btn:hover { background: var(--surface-2); color: var(--text); }
  .tcard { cursor: pointer; }
  .tcard .datebox { font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
  .tcard .sub2 { font-size: 13px; color: var(--muted); margin-top: -4px; overflow-wrap: anywhere; }
  .segs { display: flex; flex-direction: column; }
  .seg { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 2px 8px; padding: 6px 0; }
  .seg + .seg { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
  .seg-l { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg .end { display: flex; flex-direction: column; min-width: 0; }
  .seg .end.r { align-items: flex-end; text-align: right; }
  .seg .tm { font-size: 28px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: .3px; }
  .seg .tm.tbf { font-size: 20px; font-weight: 600; color: var(--faint); line-height: 1.6; }
  .seg .pl { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.35; }
  .seg .plus { font-size: 12px; font-weight: 700; color: var(--warn); }
  .seg .mid { display: flex; flex-direction: column; align-items: center; color: var(--faint); padding-top: 4px; }
  .seg .mid .ic { font-size: 16px; line-height: 1; }
  .seg .mid .ar { font-size: 18px; line-height: 1; }
  @media (max-width: 420px) { .seg .tm { font-size: 26px; } }
  .del-link { align-self: center; background: none; border: 0; color: var(--faint); font-size: 13px; padding: 10px 14px; margin-top: 4px; text-decoration: underline; min-height: 40px; }
  .del-link:hover { color: var(--muted); }
  .form-actions { display: flex; gap: 8px; justify-content: space-between; position: sticky; bottom: 0; background: var(--surface); padding: 10px 0 2px; flex-wrap: wrap; }

  .modal-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); width: 100%; max-width: 420px; border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0; color: var(--muted); }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 14px; align-items: center; z-index: 80; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px 0; }

  @media (max-width: 760px) {
    .dest-grid { grid-template-columns: 1fr; }
    .dest { aspect-ratio: 16 / 8; }
    .cards { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) { .links { grid-template-columns: 1fr; } .top h1 { font-size: 21px; } .cd-n b { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

  // 交通卡片：大号出发 / 抵达时间；跨日标「+1天」；中转逐段显示
  const KIND_IC = { plane: "✈️", train: "🚆", bus: "🚌", other: "➜" };
  const kindOf = t => t.kind || (/^(MU|QR|TO|CA|CZ|HU)\s?\d/i.test(t.no || "") || (t.legs && t.legs.length) ? "plane" : /TGV|Swiss|火车|列车|高铁|动车/.test((t.no || "") + (t.mode || "")) ? "train" : /巴士|大巴|bus/i.test(t.mode || "") ? "bus" : "other");
  const timeOf = s => { const m = /(\d{1,2}):(\d{2})/.exec(s || ""); return m ? m[1].padStart(2, "0") + ":" + m[2] : ""; };
  function dayPlus(date, arr) {
    if (!date || !arr) return null;
    const d0 = new Date(date + "T00:00:00"); if (isNaN(d0)) return null;

    else if (/次日|\+1/.test(arr)) tg = new Date(d0.getTime() + 864e5);

  // ---------- 修改日期 / 时间后自动排序（输入途中不重绘，失焦或确认后再排） ----------
  let pendingResort = null, typed = false, resortTmr = null;
  const isPlan = el => el && el.matches && el.matches('.att input[data-f="date"], .att input[data-f="time"]');
  function doResort() {
    clearTimeout(resortTmr); if (!pendingResort) return;
    const id = pendingResort; pendingResort = null; typed = false;
    const r = route(); if (r.v !== "page" || r.alt) return;
    rerender(); flashCard(id);
    const a = att(id); if (a) toast(tr("resorted", { d: a.date ? fmtShort(a.date) : tr("noDate"), t: a.time || "" }));
  }
  app.addEventListener("keydown", e => { if (isPlan(e.target)) { typed = true; if (e.key === "Enter") e.target.blur(); } });
  app.addEventListener("focusout", e => {

  async function exportJSON() {
    const json = JSON.stringify({ app: "europa-trip-2026", version: 4, dataRev: T.dataRev, exportedAt: new Date().toISOString(), state }, null, 2);
    const filename = `欧洲行程备份_${new Date().toISOString().slice(0, 10)}.json`;
    let dl = null;
    if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch (e) {} }
    if (dl) { try { await dl.save({ filename, data: json }); toast(tr("exportSaved")); } catch (e) { if (e && e.code !== "declined") toast(tr("exportFail")); } return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function importText(text) {
    let next = null; try { const d = JSON.parse(text); next = toV4(d.state || d); } catch (e) {}
    if (!next) { toast(tr("importFail")); return false; }
    if (!await ask(tr("askImport"), tr("askImportMsg"), tr("importBtn"))) return false;
    const before = clone(state); lsSet(KEY_BACKUP_IMPORT, JSON.stringify(before));
    state = next; save(); render(true);
    toast(tr("imported"), () => { state = before; save(); render(true); });
    return true;

    const OFF_KEY = "europa-trip-2026-offline-ready";
    const hadCtrl = !!navigator.serviceWorker.controller; let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadCtrl || reloading) return; reloading = true; location.reload(); });
    navigator.serviceWorker.addEventListener("message", e => { if (e.data === "cached" && !lsGet(OFF_KEY)) { lsSet(OFF_KEY, "1"); toast(tr("offReady")); } });
    const showUpd = w => {
      let b = $("#upd"); if (!b) { b = document.createElement("button"); b.id = "upd"; b.className = "upd"; b.type = "button"; document.body.appendChild(b); }
      b.textContent = tr("updAvail"); b.onclick = () => { b.textContent = tr("updating"); w.postMessage("skipWaiting"); };
    };
    window.addEventListener("load", async () => {
      try {
        const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
        if (reg.waiting && navigator.serviceWorker.controller) showUpd(reg.waiting);
        reg.addEventListener("updatefound", () => { const w = reg.installing; if (w) w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) showUpd(w); }); });
        const check = () => { if (navigator.onLine) reg.update().catch(() => {}); };
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
        window.addEventListener("online", check); setInterval(check, 30 * 60 * 1000);
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      } catch (e) {}
    });
  }

  window.__trip = { get state() { return state; }, importText, toV4, conflicts: id => conflicts(att(id)), origin: id => originHotel(att(id)) };   // 测试用
  window.addEventListener("hashchange", () => render(false));
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "zh-CN";
  if (!lsGet(KEY) || upgradedNow) save();   // 首次、刚迁移或刚升级 → 存下来（升级前的原数据已另存备份）
  render(true);
})();
</script>
</body>
</html>
