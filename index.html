<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>欧洲之旅 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 布局：首页三大目的地 + 酒店 / 交通入口；目的地页 = 已选择 / 未选择两组图片卡片；手机优先单列 */
  :root {
    --bg: #eef1f2; --surface: #ffffff; --surface-2: #e8ecee; --text: #1b2226; --muted: #5f6b73; --faint: #8a959c;
    --line: #d9dfe2; --accent: #2e5e52; --on-accent: #ffffff; --danger: #b3412f; --ok: #2f8a5c; --warn: #b7791f;
    --es: #c4533b; --fr: #3a5aa6; --ch: #b4303a; --scrim: rgba(10, 16, 20, .42);
    --shadow: 0 1px 2px rgba(20,30,40,.05), 0 6px 18px rgba(20,30,40,.06); --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111517; --surface: #1a2023; --surface-2: #232a2e; --text: #e5eaed; --muted: #9aa6ad; --faint: #75828a;
      --line: #2c3539; --accent: #7cbca8; --on-accent: #0d1f1a; --danger: #e5775f; --ok: #5cc28c; --warn: #e0a84a;
      --es: #e2805f; --fr: #86a2e6; --ch: #e7686f; --scrim: rgba(0,0,0,.6);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111517; --surface: #1a2023; --surface-2: #232a2e; --text: #e5eaed; --muted: #9aa6ad; --faint: #75828a;
    --line: #2c3539; --accent: #7cbca8; --on-accent: #0d1f1a; --danger: #e5775f; --ok: #5cc28c; --warn: #e0a84a;
    --es: #e2805f; --fr: #86a2e6; --ch: #e7686f; --scrim: rgba(0,0,0,.6);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 18px 80px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* 顶栏 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .top h1 { font-size: 24px; margin: 0; letter-spacing: .3px; }
  .top .sub { color: var(--muted); font-size: 13px; }
  .top-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13px; white-space: nowrap; min-height: 38px; }
  .chip:hover { background: var(--surface-2); }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 210px; }
  .menu-pop button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .menu-pop button:hover { background: var(--surface-2); }
  .menu-pop .danger { color: var(--danger); }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .nav .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .back { margin-bottom: 12px; }

  /* 首页 */
  .banner { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .banner b { color: var(--accent); font-size: 20px; }
  .dest-grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dest { position: relative; display: block; border: 0; padding: 0; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 5; background: var(--surface-2);
    box-shadow: var(--shadow); text-align: left; color: #fff; width: 100%; }
  .dest img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .dest .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.05) 55%); }
  .dest .txt { position: absolute; left: 16px; right: 16px; bottom: 14px; }
  .dest .flag { font-size: 26px; line-height: 1; }
  .dest .nm { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .dest .en { font-size: 14px; opacity: .9; }
  .dest .meta { font-size: 13px; opacity: .9; margin-top: 4px; }
  .links { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin-top: 12px; }
  .link-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; text-align: left; min-height: 64px; }
  .link-card .ic { font-size: 24px; }
  .link-card b { display: block; font-size: 16px; }
  .link-card span { font-size: 13px; color: var(--muted); }

  /* 目的地页 */
  .rhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 6px; }
  .rhead h2 { margin: 0; font-size: 24px; }
  .rhead .d { color: var(--muted); font-size: 14px; }
  .sec-title { font-size: 16px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .sec-title .n { font-size: 13px; color: var(--muted); font-weight: 500; }
  .cards { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .empty { color: var(--muted); font-size: 14px; padding: 14px; border: 1.5px dashed var(--line); border-radius: 12px; text-align: center; }
  .att { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; }
  .att.unsel { opacity: .92; }
  .ph { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; min-height: 0; }
  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; display: block; }
  .ph .fallback { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--muted);
    background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 12px, var(--surface) 12px, var(--surface) 24px); }
  .ph .area { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .ph .bk { position: absolute; right: 10px; top: 10px; background: var(--ok); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .att h3 { margin: 0; font-size: 18px; line-height: 1.3; }
  .local { font-size: 13px; color: var(--muted); margin-top: -6px; overflow-wrap: anywhere; }
  dl.facts { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 10px; margin: 0; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  .tbc { color: var(--faint); }
  .warn { margin: 0; font-size: 13px; padding: 7px 10px; border-radius: 8px; background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border-left: 3px solid var(--danger); }
  .map { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; min-height: 40px; padding: 8px 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); align-self: flex-start; }
  .map.none { background: none; color: var(--faint); font-weight: 400; padding-left: 0; }
  .plan { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plan label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  input[type=text], input[type=url], input[type=date], input[type=time], textarea, select {
    width: 100%; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 42px; }
  textarea { min-height: 76px; resize: vertical; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tg { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 44px; font-size: 14px; cursor: pointer; user-select: none; }
  .tg input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }
  .tg.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); font-weight: 600; }
  details.more { border-top: 1px solid var(--line); padding-top: 6px; font-size: 14px; }
  details.more summary { cursor: pointer; color: var(--muted); min-height: 36px; display: flex; align-items: center; }
  details.more .in { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  details.more p { margin: 0; overflow-wrap: anywhere; }
  .credit { font-size: 11px; color: var(--faint); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border-radius: 10px; padding: 9px 14px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; min-height: 42px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
  .btn.ghost-danger { color: var(--danger); }
  .add-btn { width: 100%; margin-top: 14px; padding: 13px; border-radius: 12px; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); font-size: 15px; }

  /* 酒店 / 交通 */
  .list { display: flex; flex-direction: column; gap: 12px; }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .item .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .item h3 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
  .item .city { font-size: 13px; color: var(--muted); }
  .item .when { font-size: 14px; font-variant-numeric: tabular-nums; }
  .item .route { font-size: 15px; font-weight: 600; }
  .item .times { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .note { font-size: 13px; color: var(--muted); }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
  .badge.ok { color: var(--ok); } .badge.no { color: var(--warn); }
  .datebox { font-size: 13px; font-weight: 700; color: var(--accent); }

  /* 编辑面板（手机底部弹出 / 电脑右侧） */
  .sheet-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; border-radius: 20px 20px 0 0;
    padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  @media (min-width: 900px) { .sheet-bg { justify-content: flex-end; align-items: stretch; } .sheet { max-width: 460px; max-height: none; height: 100%; border-radius: 0; padding: 0 24px 28px; } }
  .sheet-head { position: sticky; top: 0; background: var(--surface); z-index: 2; padding: 12px 0 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .sheet-head b { font-size: 16px; }
  .close-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; }
  .form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .form label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .form-actions { display: flex; gap: 8px; justify-content: space-between; position: sticky; bottom: 0; background: var(--surface); padding: 10px 0 2px; flex-wrap: wrap; }

  .modal-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { background: var(--surface); width: 100%; max-width: 420px; border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0; color: var(--muted); }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 14px; align-items: center; z-index: 80; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px 0; }

  @media (max-width: 760px) {
    .dest-grid { grid-template-columns: 1fr; }
    .dest { aspect-ratio: 16 / 8; }
    .cards { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) { .links { grid-template-columns: 1fr; } .top h1 { font-size: 21px; } }
</style>
</head>

  <div class="modal" role="alertdialog" aria-labelledby="askTitle">

    <div class="row"><button type="button" class="btn" id="askNo"></button><button type="button" class="btn danger" id="askYes"></button></div>

</div>

  // state = { version:4, att:{id:{sel,date,time,booked,edits}}, custom:[自添景点], hotels:{id:{booked,edits}}, transport:{id:{booked,edits}}, budget?, legacy? }

  // 补齐 / 清理 v4 数据（新增的默认景点自动加入，不改已有选择）

    out.custom = (Array.isArray(s.custom) ? s.custom : []).filter(c => c && c.name).map(c => {

    for (const [id, v] of Object.entries(s.transport || {})) if (TRA.has(id) && v) out.transport[id] = { booked: !!v.booked, edits: cleanEdits(v.edits, TRA_FIELDS) };

  // 旧版（时间线，v1/v2/v3）→ v4：按旧条目 id 对应景点；保留计划时间、已预订状态；旧数据整份放进 legacy

    for (const a of T.attractions) {
      if (!a.from) continue;
      const found = a.from.map(id => items.get(id)).filter(Boolean);
      const st = out.att[a.id];
      if (hasIds && !found.length) st.sel = false;                 // 旧版里删掉了 → 归入未选择
      const main = found[0];
      if (main) {
        const m = String(main.time || "").match(/(\d{1,2})[:：](\d{2})/);

      }
      if (found.some(it => it.booking && it.booking.status === "booked")) st.booked = true;
    }

    if (card && e.target.closest("[data-edit]")) { openAttForm(card.dataset.id); return; }
    if (card && e.target.closest("[data-delc]")) { delCustom(card.dataset.id); return; }
    const hi = e.target.closest("[data-hid]"); if (hi && e.target.closest("[data-hedit]")) { openSimpleForm("hotel", hi.dataset.hid); return; }
    const ti = e.target.closest("[data-tid]"); if (ti && e.target.closest("[data-tedit]")) { openSimpleForm("transport", ti.dataset.tid); return; }
  });
  app.addEventListener("change", e => {
    const el = e.target;
    const card = el.closest(".att");
    if (card && el.dataset.f) {
      const st = attState(card.dataset.id); if (!st) return;
      const f = el.dataset.f;
      if (f === "sel" || f === "booked") {
        st[f] = el.checked; save();
        if (f === "sel") {   // 只移动，不清除计划时间和预约状态
          const y = window.scrollY; render(true); window.scrollTo(0, y);
          toast(el.checked ? tr("moved1") : tr("moved0"), () => { st.sel = !el.checked; save(); render(true); });
        } else { el.closest(".tg").classList.toggle("on", el.checked); const ph = card.querySelector(".ph"); const b = ph.querySelector(".bk");
          if (el.checked && !b) ph.insertAdjacentHTML("beforeend", `<span class="bk">✓ ${esc(tr("bookedBadge"))}</span>`); else if (!el.checked && b) b.remove(); }
      } else { st[f] = el.value; save(); }
      return;
    }
    if (el.matches("[data-hb]")) { const id = el.closest("[data-hid]").dataset.hid; state.hotels[id].booked = el.checked; save(); render(true); return; }
    if (el.matches("[data-tb]")) { const id = el.closest("[data-tid]").dataset.tid; state.transport[id].booked = el.checked; save(); render(true); return; }
  });

  function bindTop() {
    $("#langBtn").onclick = () => { lang = lang === "zh" ? "pt" : "zh"; lsSet(LANG_KEY, lang); document.documentElement.lang = lang === "pt" ? "pt-BR" : "zh-CN"; render(true); };
    const pop = $("#menuPop");
    $("#menuBtn").onclick = e => { e.stopPropagation(); pop.hidden = !pop.hidden; };
    pop.onclick = async e => {
      const b = e.target.closest("button"); if (!b) return; pop.hidden = true;
      if (b.dataset.act === "export") exportJSON();
      if (b.dataset.act === "import") $("#importFile").click();
      if (b.dataset.act === "reset") {
        if (!await ask(tr("askReset"), tr("askResetMsg"), tr("resetBtn"))) return;
        const before = clone(state); const keep = { budget: state.budget, legacy: state.legacy };
        state = buildDefault(); if (keep.budget) state.budget = keep.budget; if (keep.legacy) state.legacy = keep.legacy;
        save(); render(true); toast(tr("restored"), () => { state = before; save(); render(true); });
      }
    };
  }
  document.addEventListener("click", () => { const p = $("#menuPop"); if (p) p.hidden = true; });

  // ---------- 编辑面板 ----------
  const sheetBg = $("#sheetBg"), sheetEl = $("#sheet");
  function openSheet(html) { sheetEl.innerHTML = html; sheetBg.hidden = false; document.documentElement.style.overflow = "hidden"; sheetEl.scrollTop = 0; }
  function closeSheet() { sheetBg.hidden = true; document.documentElement.style.overflow = ""; sheetEl.innerHTML = ""; }
  sheetBg.addEventListener("mousedown", e => { if (e.target === sheetBg) closeSheet(); });
  const field = (id, label, value, type) => `<div><label for="${id}">${esc(label)}</label>${type === "long"
    ? `<textarea id="${id}">${esc(value)}</textarea>` : `<input type="${type || "text"}" id="${id}" value="${esc(value)}" ${type === "url" ? 'inputmode="url" autocapitalize="off"' : ""}>`}</div>`;
  const ATT_FORM = [["name", ""], ["local", ""], ["area", ""], ["hours", "long"], ["price", ""], ["last", ""], ["map", "url"], ["summit", "url"], ["ticket", "url"], ["web", "url"], ["warn", ""], ["notes", "long"]];

  function openAttForm(id, region) {
    const isNew = !id, a = isNew ? { region } : att(id);
    openSheet(`
      <div class="sheet-head"><b>${esc(isNew ? tr("newAtt") : tr("editAtt"))}</b><button class="close-btn" id="shClose" aria-label="${esc(tr("close"))}">×</button></div>
      <form class="form" id="shForm" novalidate>
        ${ATT_FORM.map(([f, type]) => field("af-" + f, tr("fl_" + f), isNew ? "" : (a[f] || ""), type)).join("")}
        <div class="form-actions">
          <div>${!isNew && !a.custom ? `<button type="button" class="btn" id="shReset">${esc(tr("resetItem"))}</button>` : ""}</div>
          <div class="row-btns"><button type="button" class="btn" id="shCancel">${esc(tr("cancel"))}</button><button type="submit" class="btn primary">${esc(tr("save"))}</button></div>
        </div>
      </form>`);
    $("#shClose").onclick = closeSheet; $("#shCancel").onclick = closeSheet;
    if ($("#shReset")) $("#shReset").onclick = () => { state.att[id].edits = {}; save(); closeSheet(); render(true); toast(tr("restored")); };
    $("#shForm").onsubmit = e => {
      e.preventDefault();
      const vals = {}; for (const [f, type] of ATT_FORM) { let v = $("#af-" + f).value.trim(); if (type === "url") v = normUrl(v); vals[f] = v; }
      if (!vals.name) { const n = $("#af-name"); n.setCustomValidity(tr("nameRequired")); n.reportValidity(); n.oninput = () => n.setCustomValidity(""); return; }
      if (isNew) state.custom.push(Object.assign({ id: uid(), region, sel: true, date: "", time: "", booked: false }, vals));
      else if (a.custom) Object.assign(state.custom.find(x => x.id === id), vals);
      else {   // 只保存和默认资料不同的字段
        const d = ATT.get(id), edits = {};
        for (const f of ATT_FIELDS) if ((vals[f] ?? "") !== (d[f] ?? "")) edits[f] = vals[f] ?? "";
        state.att[id].edits = edits;
      }
      save(); closeSheet(); render(true); toast(tr("saved"));
    };
  }
  async function delCustom(id) {
    if (!await ask(tr("askDel"), "", tr("del"))) return;
    const i = state.custom.findIndex(x => x.id === id); if (i < 0) return;
    const [gone] = state.custom.splice(i, 1); save(); render(true);
    toast(tr("deleted"), () => { state.custom.splice(i, 0, gone); save(); render(true); });
  }
  function openSimpleForm(kind, id) {
    const isH = kind === "hotel";
    const fields = isH ? [["name", ""], ["city", ""], ["in", "date"], ["out", "date"], ["checkin", ""], ["checkout", ""], ["map", "url"], ["note", "long"]]
                       : [["date", "date"], ["dateEnd", "date"], ["purpose", ""], ["no", ""], ["from", ""], ["to", ""], ["dep", ""], ["arr", ""], ["note", "long"]];
    const cur = isH ? hotel(id) : trans(id), base = isH ? HOT.get(id) : TRA.get(id), st = isH ? state.hotels[id] : state.transport[id];
    openSheet(`
      <div class="sheet-head"><b>${esc(tr("edit"))}</b><button class="close-btn" id="shClose" aria-label="${esc(tr("close"))}">×</button></div>
      <form class="form" id="shForm" novalidate>
        ${fields.map(([f, type]) => field("sf-" + f, tr("fl_" + f), cur[f] || "", type)).join("")}
        <div class="form-actions"><button type="button" class="btn" id="shReset">${esc(tr("resetItem"))}</button>
          <div class="row-btns"><button type="button" class="btn" id="shCancel">${esc(tr("cancel"))}</button><button type="submit" class="btn primary">${esc(tr("save"))}</button></div></div>
      </form>`);
    $("#shClose").onclick = closeSheet; $("#shCancel").onclick = closeSheet;
    $("#shReset").onclick = () => { st.edits = {}; save(); closeSheet(); render(true); toast(tr("restored")); };
    $("#shForm").onsubmit = e => {
      e.preventDefault();
      const edits = {};
      for (const [f, type] of fields) { let v = $("#sf-" + f).value.trim(); if (type === "url") v = normUrl(v); if (v !== (base[f] ?? "")) edits[f] = v; }
      st.edits = edits; save(); closeSheet(); render(true); toast(tr("saved"));
    };
  }

  // ---------- 确认框 / 提示 ----------
  let askResolve = null;
  function ask(title, msg, okText) {
    $("#askTitle").textContent = title; $("#askMsg").textContent = msg;
    $("#askYes").textContent = okText || tr("ok"); $("#askNo").textContent = tr("cancel");
    $("#askBg").hidden = false; setTimeout(() => $("#askNo").focus(), 30);
    return new Promise(res => { askResolve = res; });
  }
  function closeAsk(v) { $("#askBg").hidden = true; if (askResolve) { askResolve(v); askResolve = null; } }
  $("#askYes").onclick = () => closeAsk(true); $("#askNo").onclick = () => closeAsk(false);
  $("#askBg").addEventListener("mousedown", e => { if (e.target.id === "askBg") closeAsk(false); });
  let toastTmr, undoFn = null;
  function toast(msg, undo) {
    $("#toastMsg").textContent = msg; undoFn = undo || null;
    const ub = $("#toastUndo"); ub.hidden = !undo; ub.textContent = tr("undo");
    $("#toast").classList.add("show"); clearTimeout(toastTmr);
    toastTmr = setTimeout(() => { $("#toast").classList.remove("show"); undoFn = null; }, undo ? 5000 : 1800);
  }
  $("#toastUndo").onclick = () => { if (undoFn) { const f = undoFn; undoFn = null; f(); } $("#toast").classList.remove("show"); };
  document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("#askBg").hidden) closeAsk(false); else if (!sheetBg.hidden) closeSheet(); });

  // ---------- 导入 / 导出（只在本机，不会自动上传） ----------
  async function exportJSON() {
    const json = JSON.stringify({ app: "europa-trip-2026", version: 4, exportedAt: new Date().toISOString(), state }, null, 2);
    const filename = `欧洲行程备份_${new Date().toISOString().slice(0, 10)}.json`;
    let dl = null;
    if (window.claude && typeof window.claude.use === "function") { try { dl = await window.claude.use("downloads"); } catch (e) {} }
    if (dl) { try { await dl.save({ filename, data: json }); toast(tr("exportSaved")); } catch (e) { if (e && e.code !== "declined") toast(tr("exportFail")); } return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function importText(text) {
    let next = null; try { const d = JSON.parse(text); next = toV4(d.state || d); } catch (e) {}
    if (!next) { toast(tr("importFail")); return false; }
    if (!await ask(tr("askImport"), tr("askImportMsg"), tr("importBtn"))) return false;
    const before = clone(state); lsSet(KEY_BACKUP_IMPORT, JSON.stringify(before));
    state = next; save(); render(true);
    toast(tr("imported"), () => { state = before; save(); render(true); });
    return true;
  }
  $("#importFile").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if (f) await importText(await f.text()); });

  window.__trip = { get state() { return state; }, importText, toV4 };   // 测试用
  window.addEventListener("hashchange", () => render(false));
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "zh-CN";
  if (!lsGet(KEY)) save();   // 首次（或刚迁移）就把 v4 存下来
  render(true);
})();
</script>
</body>
</html>
